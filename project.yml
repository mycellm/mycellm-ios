name: Mycellm
options:
  bundleIdPrefix: com.mycellm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: false

packages:
  SwiftCBOR:
    url: https://github.com/valpackett/SwiftCBOR.git
    from: "0.4.7"
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    from: "2.0.0"
  llama:
    url: https://github.com/mattt/llama.swift.git
    from: "2.8470.0"
  # MLX (Apple) — native Apple-Silicon LLM inference. We use only
  # MLXLLM + MLXLMCommon products; the MLXHuggingFace product (which
  # provides the #hubDownloader / #huggingFaceTokenizerLoader macros)
  # is intentionally NOT included — we ship a LocalTokenizerLoader
  # built on swift-transformers' AutoTokenizer.from(modelFolder:) so
  # we avoid the macro-trust UI flow + don't need the swift-huggingface
  # download client (iOS loads from cached on-device dirs only).
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    branch: main
  # Provides Tokenizers module — AutoTokenizer.from(modelFolder:) is
  # the local-directory tokenizer load used by our LocalTokenizerLoader.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: "0.1.0"

targets:
  Mycellm:
    type: application
    platform: iOS
    sources:
      - path: Mycellm
        excludes:
          - Tests/**
    resources:
      - path: Mycellm/Resources/Fonts
        buildPhase: resources
      - path: Mycellm/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mycellm.app
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "18"
        CODE_SIGN_ENTITLEMENTS: Mycellm/Mycellm.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: Mycellm/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DCMLXQ5H7M
    dependencies:
      - package: SwiftCBOR
      - package: Hummingbird
      - package: llama
        product: LlamaSwift
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      # MLXVLM enables vision-language models (MLXBackend's #if canImport(MLXVLM)
      # path). Without it, vision models fall back to the text path (images
      # dropped). Same package as MLXLLM — no new SwiftPM source to resolve.
      - package: mlx-swift-lm
        product: MLXVLM
      - package: swift-transformers
        product: Transformers

  MycellmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Mycellm/Tests
    dependencies:
      - target: Mycellm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mycellm.app.tests
        GENERATE_INFOPLIST_FILE: true

# Explicit scheme so xcodegen emits one with debugEnabled: false.
# This avoids Xcode 26.x's slow + flaky dyld_shared_cache_extract_dylibs
# step when installing on a wireless physical device for the first time
# (errors with DVTDeviceSymbolsCoordinatorErrorDomain 908). The app
# still installs and launches normally; you just can't attach breakpoints
# or see symbolicated stack traces. Run in the simulator for full debug.
schemes:
  Mycellm:
    build:
      targets:
        Mycellm: all
        MycellmTests: [test]
    run:
      config: Debug
      debugEnabled: false
    test:
      config: Debug
      targets:
        - MycellmTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
